[project]
name = "agentops"
version = "0.1.0"
description = "基于 LangGraph 与 MCP 的研发工单自动化 Agent 系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "mcp>=1.0.0",
    "pypdf>=4.3.0",
    "python-docx>=1.1.0",
    "redis>=5.0.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.2.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B006"]

# 让编辑器（basedpyright）固定使用项目虚拟环境解析依赖，
# 避免误报 "无法解析导入"：系统 Python 3.14 中没有安装项目依赖。
# 注意：[tool.pyright] 与 [tool.basedpyright] 不能同时存在，只能保留一个。
[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: 需要真实网络或外部服务的测试（默认跳过）",
]

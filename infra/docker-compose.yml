# 本地一键启动（自托管备份路径）
# 注意：线上采用 Neon + Railway，此文件仅用于本地演示与离线排查。
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: agentops
      POSTGRES_DB: agentops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://agentops:agentops@db:5432/agentops
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      AGENT_MODE: echo
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    environment:
      # Next.js：前端请求走 /api/*，由 next.config.ts rewrite 转发
      NEXT_PUBLIC_API_BASE_URL: /api
      API_PROXY_TARGET: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
